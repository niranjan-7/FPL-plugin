<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgFpl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38003c" />
      <stop offset="60%" stop-color="#240029" />
      <stop offset="100%" stop-color="#120015" />
    </linearGradient>
    <linearGradient id="neonFpl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00ff87" />
    </linearGradient>
    <filter id="sparkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rich Premier League Dark Purple squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgFpl)" />

  <!-- Subtle inner ambient edge -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#neonFpl)" stroke-width="1.5" opacity="0.4" />

  <!-- FPL Crown at top -->
  <path d="M40,32 L50,16 L64,24 L78,16 L88,32 Z" fill="url(#neonFpl)" />
  <circle cx="50" cy="15" r="3" fill="#ffffff" />
  <circle cx="64" cy="23" r="3" fill="#ffffff" />
  <circle cx="78" cy="15" r="3" fill="#ffffff" />

  <!-- Bold High-Impact FPL Monogram -->
  <text x="64" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Arial Black', Impact, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">FPL</text>

  <!-- Electric Mint AI Pill Badge -->
  <rect x="36" y="86" width="56" height="22" rx="11" fill="url(#neonFpl)" />
  <text x="64" y="102" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#200026" text-anchor="middle" letter-spacing="2">AI</text>

  <!-- 4-point Gemini AI Sparkle top-right -->
  <path d="M102,23 Q102,33 92,33 Q102,33 102,43 Q102,33 112,33 Q102,33 102,23 Z" fill="url(#sparkGrad)" filter="url(#sparkGlow)" />
  <circle cx="102" cy="33" r="2" fill="#ffffff" />
</svg>
